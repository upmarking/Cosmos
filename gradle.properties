android.useAndroidX=true
android.enableJetifier=false
# Increased memory for Kotlin daemon to avoid OOM during IR lowering
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+UseG1GC -XX:+HeapDumpOnOutOfMemoryError
kotlin.daemon.jvmargs=-Xmx4g
# STRICTly limit to 1 worker and no parallelism to avoid OOM during mergeExtDex
org.gradle.workers.max=1
org.gradle.parallel=false
org.gradle.caching=true
android.nonTransitiveRClass=true
# Specifically disable parallel dexing
android.enableDexingArtifactTransform.parallel=false
org.gradle.vfs.watch=false
