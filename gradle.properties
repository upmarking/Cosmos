android.useAndroidX=true
android.enableJetifier=false
# Adjusted memory for Kotlin daemon and Gradle to fit in a 7GB RAM system
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -XX:+UseG1GC -XX:+HeapDumpOnOutOfMemoryError
kotlin.daemon.jvmargs=-Xmx2g
# STRICTly limit to 1 worker and no parallelism to avoid OOM during mergeExtDex
org.gradle.workers.max=1
org.gradle.parallel=false
org.gradle.caching=true
android.nonTransitiveRClass=true
# Specifically disable parallel dexing
android.enableDexingArtifactTransform.parallel=false
org.gradle.vfs.watch=false
kotlin.incremental=false
